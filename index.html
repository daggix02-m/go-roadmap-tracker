<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Plan Tracker</title>
    <!-- Content-Security-Policy: no third-party scripts; allow inline styles
         (Tailwind) and connections to the Convex backend + site. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://tacit-leopard-708.convex.cloud wss://tacit-leopard-708.convex.cloud https://tacit-leopard-708.convex.site; worker-src 'self'; manifest-src 'self'; font-src 'self' data:;"
    />
    <meta
      name="description"
      content="Track progress through any roadmap or plan — build your own phases, steps, and exit criteria."
    />

    <!-- PWA -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Plan Tracker" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="Plan Tracker" />
    <meta
      property="og:description"
      content="Track progress through any roadmap or plan — build your own phases, steps, and exit criteria."
    />
    <meta property="og:type" content="website" />
  </head>
  <body class="bg-page text-text antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
